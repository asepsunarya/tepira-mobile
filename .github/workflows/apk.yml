name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TEPIRA_API_BASE_URL: https://tepira.asepsunarya.com/api
      # Google OAuth client IDs: repo secret wins, else repo variable, else empty.
      TEPIRA_GOOGLE_SERVER_CLIENT_ID: ${{ secrets.TEPIRA_GOOGLE_SERVER_CLIENT_ID || vars.TEPIRA_GOOGLE_SERVER_CLIENT_ID }}
      TEPIRA_GOOGLE_IOS_CLIENT_ID: ${{ secrets.TEPIRA_GOOGLE_IOS_CLIENT_ID || vars.TEPIRA_GOOGLE_IOS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Signing secrets are scoped to this step only. This is the stable DEV
      # key; a future release key will use separate ANDROID_RELEASE_* secrets.
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > android/key.properties
            echo "Signing with the dev keystore from repo secrets."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set; APK is signed with the debug key."
          fi

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=TEPIRA_API_BASE_URL="$TEPIRA_API_BASE_URL" \
            --dart-define=TEPIRA_GOOGLE_SERVER_CLIENT_ID="$TEPIRA_GOOGLE_SERVER_CLIENT_ID" \
            --dart-define=TEPIRA_GOOGLE_IOS_CLIENT_ID="$TEPIRA_GOOGLE_IOS_CLIENT_ID"

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
            "build/app/outputs/flutter-apk/tepira-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tepira-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/tepira-*.apk
          if-no-files-found: error

      # Per-ABI APKs: the fat APK exceeds WhatsApp's 50 MB limit, so also ship
      # a standalone arm64-v8a APK (covers nearly all current Android phones).
      # Staged outside flutter-apk/ so it never matches the fat artifact glob.
      - name: Build split-per-ABI APKs
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=TEPIRA_API_BASE_URL="$TEPIRA_API_BASE_URL" \
            --dart-define=TEPIRA_GOOGLE_SERVER_CLIENT_ID="$TEPIRA_GOOGLE_SERVER_CLIENT_ID" \
            --dart-define=TEPIRA_GOOGLE_IOS_CLIENT_ID="$TEPIRA_GOOGLE_IOS_CLIENT_ID"
          mkdir -p build/apk-split
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "build/apk-split/tepira-arm64-${GITHUB_SHA::7}.apk"
          ls -l build/apk-split

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tepira-arm64-${{ github.sha }}
          path: build/apk-split/tepira-arm64-*.apk
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
