name: tepira_mobile
description: Aplikasi mobile tepira.id - nabung sedikit-sedikit untuk goal finansial.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  google_sign_in: ^6.2.0
  google_fonts: ^6.2.0
  flutter_svg: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Nunito 700/800/900 (OFL) bundled so google_fonts never fetches at runtime.
    - assets/fonts/
    - assets/brands/
