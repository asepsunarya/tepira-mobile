<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Setoran rutin per kavling</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:#cfe9f7;color:#5a4a5e}
a{color:#c2457d;text-decoration:none}a:hover{color:#a8336a}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #cfe9f7 0%, #e3f2fb 45%, #fbf1f5 100%); color: #5a4a5e; display: flex; flex-direction: column; overflow: hidden; font-family: 'Nunito', system-ui, sans-serif; font-weight: 700">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 16px 0 16px">
    <a href="GoalDetail.dc.html" aria-label="Kembali ke kavling" style="width: 44px; height: 44px; border-radius: 16px; background: rgba(255,250,247,0.9); border: 2px solid #ffffff; box-shadow: 0 6px 16px rgba(120,60,100,0.14); display: flex; align-items: center; justify-content: center; color: #5a4a5e">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-size: 15px; font-weight: 900">Setoran rutin</span>
    <a href="TagihanRutin.dc.html" aria-label="Tambah setoran rutin" style="width: 44px; height: 44px; border-radius: 16px; background: rgba(255,250,247,0.9); border: 2px solid #ffffff; box-shadow: 0 6px 16px rgba(120,60,100,0.14); display: flex; align-items: center; justify-content: center; color: #c2457d">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 0 16px; flex: 1 1 0; min-height: 0; overflow: hidden">

    <div style="background: rgba(255,250,247,0.88); border: 2px solid #ffffff; border-radius: 18px; box-shadow: 0 10px 30px rgba(120,60,100,0.14); padding: 12px 14px; display: flex; align-items: center; gap: 12px">
      <div style="width: 44px; height: 44px; border-radius: 14px; background: #dcf5ec; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.08)">
        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" fill="#fffaf7" stroke="#5a4a5e" stroke-width="1.5"></rect><rect x="10" y="14" width="4" height="6" fill="#f3c35b"></rect></svg>
      </div>
      <div style="display: flex; flex-direction: column; flex: 1 1 0; min-width: 0">
        <span style="font-size: 14px; font-weight: 900">Dana darurat</span>
        <span style="font-size: 11px; font-weight: 800; color: #74647a">{{summary}}</span>
      </div>
    </div>

    <div style="background: #ffffff; border: 2px solid #f6ebf0; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 800">
        <span>Kejar deadline butuh</span>
        <span style="font-weight: 900">Rp765.000/minggu</span>
      </div>
      <div style="height: 8px; border-radius: 999px; background: #f3e8ee; overflow: hidden">
        <div style="width: {{coverW}}; height: 8px; border-radius: 999px; background: {{coverBar}}"></div>
      </div>
      <span style="font-size: 11px; font-weight: 800; color: {{coverColor}}">{{coverNote}}</span>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 0 4px">
      <span style="font-size: 12px; font-weight: 900; color: #74647a; text-transform: uppercase; letter-spacing: 0.04em">Aturan rutin</span>
      <span style="font-size: 11px; font-weight: 800; background: #ffffff; padding: 1px 8px; border-radius: 999px; color: #74647a">{{count}}</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{rules}}" as="r" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 8px; background: #ffffff; border: 2px solid {{r.border}}; border-radius: 16px; padding: 10px 12px; opacity: {{r.opacity}}">
          <div style="display: flex; align-items: center; gap: 10px">
            <div style="display: flex; flex-direction: column; flex: 1 1 0; min-width: 0">
              <span style="font-size: 14px; font-weight: 800">{{r.name}}</span>
              <span style="font-size: 11px; font-weight: 800; color: #74647a">{{r.meta}}</span>
            </div>
            <span style="font-size: 14px; font-weight: 900; color: #1f8a63">{{r.amount}}</span>
          </div>
          <div style="display: flex; gap: 6px; align-items: center">
            <span style="font-size: 11px; font-weight: 900; background: {{r.modeBg}}; color: {{r.modeColor}}; padding: 4px 10px; border-radius: 999px">{{r.mode}}</span>
            <button type="button" onClick="{{r.toggle}}" style="margin-left: auto; height: 32px; padding: 0 12px; border-radius: 999px; border: 2px solid #f1e4ea; background: #ffffff; color: #5a4a5e; font-size: 11px; font-weight: 900; cursor: pointer">{{r.action}}</button>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="padding: 12px 16px 36px 16px">
    <a href="TagihanRutin.dc.html" style="height: 56px; border-radius: 999px; background: linear-gradient(180deg, #cf3b7b, #bf3571); color: #ffffff; font-weight: 900; font-size: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 14px 26px -12px rgba(191,53,113,0.7)">Tambah setoran rutin</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { paused: [false, false, true] };
  }
  fmt(n) { return 'Rp' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  renderVals() {
    const defs = [
      { name: 'Nabung mingguan', meta: 'Tiap Senin · dari GoPay', amount: 100000, perWeek: 100000, auto: true },
      { name: 'Sisihkan gajian', meta: 'Tiap bulan tanggal 25 · dari BCA', amount: 1500000, perWeek: 346000, auto: false },
      { name: 'Tantangan 20 ribu', meta: 'Tiap hari · dari Tunai', amount: 20000, perWeek: 140000, auto: false }
    ];
    const paused = this.state.paused;
    const rules = defs.map((d, i) => {
      const p = paused[i];
      return {
        ...d,
        amount: this.fmt(d.amount),
        mode: d.auto ? 'Otomatis' : 'Lewat kotak pos',
        modeBg: d.auto ? '#dcf5ec' : '#ffd3e4',
        modeColor: d.auto ? '#1f8a63' : '#c2457d',
        action: p ? 'Lanjutkan' : 'Jeda',
        border: p ? '#f6ebf0' : '#cdeee3',
        opacity: p ? '0.55' : '1',
        toggle: () => { const n = paused.slice(); n[i] = !n[i]; this.setState({ paused: n }); }
      };
    });
    const active = defs.filter((d, i) => !paused[i]);
    const perWeek = active.reduce((t, d) => t + d.perWeek, 0);
    const cover = Math.min(1, perWeek / 765000);
    return {
      rules,
      count: active.length + ' aktif',
      summary: 'Rp3.450.000 dari Rp10.000.000 · target 31 Des 2026',
      coverW: Math.round(cover * 100) + '%',
      coverBar: cover >= 1 ? '#6cc8ad' : '#f3c35b',
      coverColor: cover >= 1 ? '#1f8a63' : '#a87a12',
      coverNote: cover >= 1 ? 'Aturan rutin sudah menutup kebutuhan. Tukang bekerja sesuai jadwal.' : 'Rutin menutup ' + this.fmt(perWeek) + '/minggu, kurang ' + this.fmt(765000 - perWeek) + '. Sisanya setor manual.'
    };
  }
}
</script>
</body>
</html>
