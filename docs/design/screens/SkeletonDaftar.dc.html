<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Daftar sedang dimuat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:#cfe9f7;color:#5a4a5e}
a{color:#c2457d;text-decoration:none}a:hover{color:#a8336a}
button{font-family:inherit}
@keyframes shimmer{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
.sk{background:#ede3ea;border-radius:999px;animation:shimmer 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.sk{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #cfe9f7 0%, #e3f2fb 45%, #fbf1f5 100%); color: #5a4a5e; display: flex; flex-direction: column; overflow: hidden; font-family: 'Nunito', system-ui, sans-serif; font-weight: 700">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 16px 0 16px">
    <a href="Main.dc.html" aria-label="Kembali ke desa" style="width: 44px; height: 44px; border-radius: 16px; background: rgba(255,250,247,0.9); border: 2px solid #ffffff; box-shadow: 0 6px 16px rgba(120,60,100,0.14); display: flex; align-items: center; justify-content: center; color: #5a4a5e">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="display: flex; padding: 4px; gap: 2px; background: rgba(255,250,247,0.9); border: 2px solid #ffffff; border-radius: 16px; box-shadow: 0 6px 16px rgba(120,60,100,0.14)">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button type="button" onClick="{{t.pick}}" style="height: 36px; padding: 0 12px; border-radius: 12px; border: 0; background: {{t.bg}}; color: {{t.color}}; font-size: 12px; font-weight: 900; cursor: pointer">{{t.label}}</button>
      </sc-for>
    </div>
    <div style="width: 44px; height: 44px"></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 0 16px; flex: 1 1 0; min-height: 0; overflow: hidden" aria-busy="true" aria-label="Memuat daftar">

    <sc-if value="{{isKavling}}" hint-placeholder-val="{{true}}">
      <div style="background: rgba(255,250,247,0.88); border: 2px solid #ffffff; border-radius: 22px; box-shadow: 0 10px 30px rgba(120,60,100,0.18); padding: 14px; display: flex; flex-direction: column; gap: 12px">
        <div style="height: 150px; border-radius: 16px; background: linear-gradient(180deg, #d8effa, #c7e6f4); position: relative; overflow: hidden">
          <svg aria-hidden="true" width="326" height="150" viewBox="0 0 326 150" style="position: absolute; left: 0; top: 0"><ellipse cx="163" cy="124" rx="140" ry="24" fill="#a9d9ea"></ellipse><ellipse cx="163" cy="116" rx="108" ry="18" fill="#eadfa3"></ellipse><ellipse cx="163" cy="110" rx="94" ry="14" fill="#b6ddd0"></ellipse><rect x="124" y="62" width="78" height="52" rx="6" fill="#ede3ea"></rect></svg>
          <span class="sk" style="position: absolute; left: 10px; top: 10px; width: 96px; height: 24px"></span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: flex-end">
          <div style="display: flex; flex-direction: column; gap: 6px"><span class="sk" style="display: block; width: 140px; height: 16px"></span><span class="sk" style="display: block; width: 170px; height: 10px"></span></div>
          <span class="sk" style="display: block; width: 48px; height: 28px"></span>
        </div>
        <span class="sk" style="display: block; height: 10px"></span>
        <span class="sk" style="display: block; height: 36px; border-radius: 12px"></span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{four}}" as="x" hint-placeholder-count="4">
          <div style="background: #ffffff; border: 2px solid #f6ebf0; border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px"><span class="sk" style="display: block; width: 60px; height: 8px"></span><span class="sk" style="display: block; width: 100px; height: 12px"></span></div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{isRiwayat}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; gap: 6px"><span class="sk" style="display: block; flex: 1 1 0; height: 36px"></span><span class="sk" style="display: block; flex: 1 1 0; height: 36px"></span><span class="sk" style="display: block; flex: 1 1 0; height: 36px"></span></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
        <div style="background: #ffffff; border: 2px solid #f6ebf0; border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px"><span class="sk" style="display: block; width: 60px; height: 8px"></span><span class="sk" style="display: block; width: 100px; height: 14px"></span></div>
        <div style="background: #ffffff; border: 2px solid #f6ebf0; border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px"><span class="sk" style="display: block; width: 60px; height: 8px"></span><span class="sk" style="display: block; width: 100px; height: 14px"></span></div>
      </div>
      <span class="sk" style="display: block; width: 70px; height: 10px; margin-left: 4px"></span>
    </sc-if>

    <sc-if value="{{isWarung}}" hint-placeholder-val="{{false}}">
      <span class="sk" style="display: block; height: 44px; border-radius: 14px"></span>
      <div style="display: flex; gap: 6px"><span class="sk" style="display: block; width: 64px; height: 34px"></span><span class="sk" style="display: block; width: 96px; height: 34px"></span><span class="sk" style="display: block; width: 84px; height: 34px"></span><span class="sk" style="display: block; width: 90px; height: 34px"></span></div>
      <div style="background: rgba(255,250,247,0.88); border: 2px solid #ffffff; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px"><span class="sk" style="display: block; width: 140px; height: 14px"></span><span class="sk" style="display: block; height: 8px"></span><span class="sk" style="display: block; width: 200px; height: 10px"></span></div>
    </sc-if>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
        <div style="display: flex; gap: 10px; align-items: center; background: #ffffff; border-radius: 12px; padding: 10px; border: 2px solid #f6ebf0">
          <span class="sk" style="display: block; width: 40px; height: 10px"></span>
          <div style="display: flex; flex-direction: column; flex: 1 1 0; gap: 6px"><span class="sk" style="display: block; width: {{r.w}}; height: 12px"></span><span class="sk" style="display: block; width: 150px; height: 9px"></span></div>
          <span class="sk" style="display: block; width: 70px; height: 14px"></span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="padding: 12px 16px 36px 16px">
    <span class="sk" style="display: block; height: 56px"></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 0 };
  }
  renderVals() {
    const names = ['Kavling', 'Riwayat', 'Warung'];
    const tabs = names.map((n, i) => {
      const on = i === this.state.tab;
      return { label: n, pick: () => this.setState({ tab: i }), bg: on ? '#ffd3e4' : 'transparent', color: on ? '#c2457d' : '#74647a' };
    });
    const t = this.state.tab;
    const rowsN = t === 0 ? 3 : 5;
    const widths = ['120px', '90px', '140px', '100px', '110px'];
    return {
      tabs,
      isKavling: t === 0,
      isRiwayat: t === 1,
      isWarung: t === 2,
      four: [1, 2, 3, 4],
      rows: widths.slice(0, rowsN).map((w) => ({ w }))
    };
  }
}
</script>
</body>
</html>
