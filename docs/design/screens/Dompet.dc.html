<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Peti harta dompet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:#cfe9f7;color:#5a4a5e}
a{color:#c2457d;text-decoration:none}a:hover{color:#a8336a}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #cfe9f7 0%, #e3f2fb 45%, #fbf1f5 100%); color: #5a4a5e; display: flex; flex-direction: column; overflow: hidden; font-family: 'Nunito', system-ui, sans-serif; font-weight: 700">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 16px 0 16px">
    <a href="Main.dc.html" aria-label="Kembali ke desa" style="width: 44px; height: 44px; border-radius: 16px; background: rgba(255,250,247,0.9); border: 2px solid #ffffff; box-shadow: 0 6px 16px rgba(120,60,100,0.14); display: flex; align-items: center; justify-content: center; color: #5a4a5e">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-size: 15px; font-weight: 900">Peti harta</span>
    <button type="button" onClick="{{toggleHide}}" aria-label="Sembunyikan angka" style="width: 44px; height: 44px; border-radius: 16px; background: rgba(255,250,247,0.9); border: 2px solid #ffffff; box-shadow: 0 6px 16px rgba(120,60,100,0.14); display: flex; align-items: center; justify-content: center; color: #5a4a5e; cursor: pointer">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 0 16px; flex: 1 1 0; min-height: 0; overflow: hidden">

    <div style="background: rgba(255,250,247,0.88); border: 2px solid #ffffff; border-radius: 22px; box-shadow: 0 10px 30px rgba(120,60,100,0.18); padding: 16px; display: flex; align-items: center; gap: 14px">
      <svg aria-hidden="true" width="84" height="72" viewBox="0 0 84 72"><rect x="6" y="30" width="72" height="36" rx="6" fill="#cc922c"></rect><rect x="6" y="18" width="72" height="18" rx="8" fill="#e3a93c"></rect><rect x="6" y="34" width="72" height="4" fill="#a8761f"></rect><rect x="36" y="30" width="12" height="12" rx="2" fill="#5a4a5e"></rect><rect x="40" y="34" width="4" height="5" fill="#f3c35b"></rect><circle cx="22" cy="22" r="6" fill="#f8d77f"></circle><circle cx="42" cy="18" r="6" fill="#f8d77f"></circle><circle cx="62" cy="22" r="6" fill="#f8d77f"></circle><circle cx="32" cy="14" r="5" fill="#f3c35b"></circle><circle cx="52" cy="12" r="5" fill="#f3c35b"></circle></svg>
      <div style="display: flex; flex-direction: column; gap: 4px; flex: 1 1 0; min-width: 0">
        <span style="font-size: 11px; font-weight: 800; color: #74647a; text-transform: uppercase; letter-spacing: 0.03em">Total saldo</span>
        <span style="font-size: 26px; font-weight: 900; letter-spacing: -0.4px; line-height: 1">{{total}}</span>
        <span style="font-size: 11px; font-weight: 800; color: #c23b3b">Utang {{debt}} dari kartu kredit</span>
        <a href="Gaji.dc.html" style="font-size: 11px; font-weight: 900; color: #c2457d; min-height: 24px; display: flex; align-items: center">Alokasi gaji November</a>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 0 4px">
      <span style="font-size: 12px; font-weight: 900; color: #74647a; text-transform: uppercase; letter-spacing: 0.04em">Dompet</span>
      <span style="font-size: 11px; font-weight: 800; background: #ffffff; padding: 1px 8px; border-radius: 999px; color: #74647a">5</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{wallets}}" as="w" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 10px; background: #ffffff; border: 2px solid {{w.border}}; border-radius: 16px; padding: 10px">
          <div style="width: 44px; height: 44px; border-radius: 14px; background: {{w.tile}}; border: 2px solid #f1e4ea; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: {{w.initialColor}}; font-size: 13px; font-weight: 900; position: relative">
            <sc-if value="{{w.hasLogo}}" hint-placeholder-val="{{true}}">
              <img src="{{w.logo}}" alt="" style="width: 36px; height: 22px; object-fit: contain">
            </sc-if>
            <sc-if value="{{w.noLogo}}" hint-placeholder-val="{{false}}">{{w.initial}}</sc-if>
            <sc-if value="{{w.hasCard}}" hint-placeholder-val="{{false}}">
              <span style="position: absolute; right: -6px; bottom: -6px; width: 26px; height: 18px; border-radius: 5px; background: #ffffff; border: 1px solid #f1e4ea; display: flex; align-items: center; justify-content: center"><img src="{{w.card}}" alt="" style="width: 20px; height: 12px; object-fit: contain"></span>
            </sc-if>
          </div>
          <div style="display: flex; flex-direction: column; flex: 1 1 0; min-width: 0">
            <span style="font-size: 14px; font-weight: 800">{{w.name}}</span>
            <span style="font-size: 11px; font-weight: 800; color: #74647a">{{w.kind}} · jajan bulan ini {{w.spent}}</span>
          </div>
          <span style="font-size: 14px; font-weight: 900; color: {{w.color}}">{{w.balance}}</span>
        </div>
      </sc-for>
    </div>

    <div style="background: #fff8dd; border-radius: 12px; padding: 8px 10px; display: flex; gap: 8px; align-items: flex-start; font-size: 12px; font-weight: 800; line-height: 1.45">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a87a12" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 auto; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01M11 12h1v4h1"></path></svg>
      <span>Ukuran peti di desa ikut porsi saldo. Dompet utang tampil merah dan membesar saat tagihan naik.</span>
    </div>
  </div>

  <div style="padding: 12px 16px 36px 16px; display: flex; gap: 8px">
    <a href="TambahSetoran.dc.html" style="flex: 1 1 0; height: 56px; border-radius: 999px; background: linear-gradient(180deg, #cf3b7b, #bf3571); color: #ffffff; font-weight: 900; font-size: 15px; display: flex; align-items: center; justify-content: center; box-shadow: 0 14px 26px -12px rgba(191,53,113,0.7)">Catat jajan</a>
    <a href="TambahDompet.dc.html" style="flex: 1 1 0; height: 56px; border-radius: 999px; background: rgba(255,255,255,0.86); border: 2px solid #f1e4ea; color: #5a4a5e; font-weight: 900; font-size: 15px; display: flex; align-items: center; justify-content: center">Tambah dompet</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { hidden: false };
  }
  renderVals() {
    const h = this.state.hidden;
    const mask = (s) => (h ? 'Rp•••••' : s);
    return {
      toggleHide: () => this.setState({ hidden: !h }),
      total: mask('Rp3.570.000'),
      debt: mask('Rp1.250.000'),
      wallets: [
        { name: 'Tunai', kind: 'Cash', initial: 'Rp', initialColor: '#1f8a63', tile: '#dcf5ec', logo: '', card: '', hasLogo: false, noLogo: true, hasCard: false, balance: mask('Rp320.000'), spent: mask('Rp410.000'), color: '#5a4a5e', border: '#f6ebf0' },
        { name: 'GoPay', kind: 'E-wallet', initial: '', initialColor: '#ffffff', tile: '#ffffff', logo: '/_blob/80ae5963e87248dc3453f6f7dcdef70a', card: '', hasLogo: true, noLogo: false, hasCard: false, balance: mask('Rp450.000'), spent: mask('Rp620.000'), color: '#5a4a5e', border: '#f6ebf0' },
        { name: 'DANA', kind: 'E-wallet', initial: '', initialColor: '#ffffff', tile: '#ffffff', logo: '/_blob/a678fdfcc32ea842b0b3ec37c0636a52', card: '', hasLogo: true, noLogo: false, hasCard: false, balance: mask('Rp120.000'), spent: mask('Rp85.000'), color: '#5a4a5e', border: '#f6ebf0' },
        { name: 'BCA', kind: 'Rekening', initial: '', initialColor: '#ffffff', tile: '#ffffff', logo: '/_blob/9ad0f3450c048e25bcd9da18ac2a8d7f', card: '', hasLogo: true, noLogo: false, hasCard: false, balance: mask('Rp4.050.000'), spent: mask('Rp1.150.000'), color: '#5a4a5e', border: '#f6ebf0' },
        { name: 'Kartu kredit BCA', kind: 'Utang · Visa', initial: '', initialColor: '#ffffff', tile: '#ffffff', logo: '/_blob/9ad0f3450c048e25bcd9da18ac2a8d7f', card: '/_blob/b70273dcb616dd3a7d264af83ec9620e', hasLogo: true, noLogo: false, hasCard: true, balance: mask('-Rp1.250.000'), spent: mask('Rp0'), color: '#c23b3b', border: '#ffd0d0' }
      ]
    };
  }
}
</script>
</body>
</html>
