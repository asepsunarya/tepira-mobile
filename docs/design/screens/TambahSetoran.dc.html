<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Catat setoran</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:#cfe9f7;color:#5a4a5e}
a{color:#c2457d;text-decoration:none}a:hover{color:#a8336a}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #cfe9f7 0%, #e3f2fb 45%, #fbf1f5 100%); color: #5a4a5e; display: flex; flex-direction: column; overflow: hidden; font-family: 'Nunito', system-ui, sans-serif; font-weight: 700">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 16px 0 16px">
    <a href="Main.dc.html" aria-label="Tutup" style="width: 44px; height: 44px; border-radius: 16px; background: rgba(255,250,247,0.9); border: 2px solid #ffffff; box-shadow: 0 6px 16px rgba(120,60,100,0.14); display: flex; align-items: center; justify-content: center; color: #5a4a5e">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <div style="display: flex; padding: 4px; gap: 2px; background: rgba(255,250,247,0.9); border: 2px solid #ffffff; border-radius: 16px; box-shadow: 0 6px 16px rgba(120,60,100,0.14)">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
        <button type="button" onClick="{{m.pick}}" style="height: 36px; padding: 0 14px; border-radius: 12px; border: 0; background: {{m.bg}}; color: {{m.color}}; font-size: 13px; font-weight: 900; cursor: pointer; box-shadow: {{m.ring}}">{{m.label}}</button>
      </sc-for>
    </div>
    <div style="width: 44px; height: 44px"></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 0 16px; flex: 1 1 0; min-height: 0">

    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="cepat" style="font-size: 12px; font-weight: 800; color: #74647a; padding-left: 4px">Catat cepat</label>
      <div style="display: flex; align-items: center; gap: 6px; background: #fff8fb; border: 2px solid #f1e4ea; border-radius: 14px; padding: 4px 4px 4px 12px">
        <input id="cepat" type="text" placeholder="misal: nabung 20rb dana darurat" style="flex: 1 1 0; min-width: 0; height: 40px; border: 0; background: transparent; font-size: 14px; font-weight: 700; color: #5a4a5e; outline: none">
        <a href="Suara.dc.html" aria-label="Catat lewat suara" style="width: 40px; height: 40px; border-radius: 12px; background: #ffd3e4; color: #c2457d; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
        </a>
      </div>
    </div>

    <button type="button" style="display: flex; align-items: center; gap: 10px; background: #ffffff; border: 2px solid #f6ebf0; border-radius: 16px; padding: 8px 10px; color: #5a4a5e; text-align: left; cursor: pointer">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: #dcf5ec; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.08)">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" fill="#fffaf7" stroke="#5a4a5e" stroke-width="1.5"></rect><rect x="10" y="14" width="4" height="6" fill="#f3c35b"></rect></svg>
      </div>
      <div style="display: flex; flex-direction: column; flex: 1 1 0">
        <span style="font-size: 10px; font-weight: 800; color: #74647a; text-transform: uppercase">{{targetLabel}}</span>
        <span style="font-size: 14px; font-weight: 900">{{targetName}}</span>
      </div>
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#74647a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
    </button>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0">
      <span style="font-size: 12px; font-weight: 800; color: #74647a">Nominal</span>
      <div aria-live="polite" style="font-size: 40px; font-weight: 900; letter-spacing: -0.8px; line-height: 1; color: {{amountColor}}">{{amountLabel}}</div>
      <span style="font-size: 12px; font-weight: 800; color: #74647a">{{hint}}</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{chips}}" as="chip" hint-placeholder-count="4">
        <button type="button" onClick="{{chip.pick}}" style="height: 40px; border-radius: 999px; border: 2px solid {{chip.border}}; background: {{chip.bg}}; color: {{chip.color}}; font-size: 12px; font-weight: 900; cursor: pointer">{{chip.label}}</button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="dompet" style="font-size: 12px; font-weight: 800; color: #74647a; padding-left: 4px">Dompet</label>
        <div style="display: flex; align-items: center; gap: 8px; height: 42px; box-sizing: border-box; border: 2px solid #f1e4ea; border-radius: 12px; background: #fff8fb; padding: 0 8px 0 6px">
          <span style="width: 44px; height: 28px; border-radius: 8px; background: #ffffff; border: 1px solid #f1e4ea; display: flex; align-items: center; justify-content: center; flex: 0 0 auto"><img src="/_blob/80ae5963e87248dc3453f6f7dcdef70a" alt="" style="width: 38px; height: 18px; object-fit: contain"></span>
          <input id="dompet" type="text" value="GoPay" style="flex: 1 1 0; min-width: 0; height: 36px; border: 0; background: transparent; font-size: 14px; font-weight: 700; color: #5a4a5e; outline: none">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#74647a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
        </div>
        <a href="PilihTempat.dc.html" style="font-size: 11px; font-weight: 900; color: #c2457d; min-height: 24px; display: flex; align-items: center; padding-left: 4px">+ Tempat (opsional)</a>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="tgl" style="font-size: 12px; font-weight: 800; color: #74647a; padding-left: 4px">Tanggal</label>
        <input id="tgl" type="text" value="Hari ini" style="height: 42px; box-sizing: border-box; border: 2px solid #f1e4ea; border-radius: 12px; background: #fff8fb; padding: 0 10px; font-size: 14px; font-weight: 700; color: #5a4a5e; outline: none">
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: auto">
      <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
        <button type="button" onClick="{{k.press}}" aria-label="{{k.aria}}" style="height: 50px; border-radius: 14px; border: 2px solid #f6ebf0; background: #ffffff; color: #5a4a5e; font-size: 20px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center">{{k.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="padding: 12px 16px 36px 16px">
    <a href="GoalDetail.dc.html" style="height: 56px; border-radius: 999px; background: {{ctaBg}}; color: #ffffff; font-weight: 900; font-size: 16px; display: flex; align-items: center; justify-content: center; box-shadow: {{ctaShadow}}">{{ctaLabel}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { amount: 20000, mode: 'setor' };
  }
  format(n) {
    return 'Rp' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }
  renderVals() {
    const { amount, mode } = this.state;
    const spend = mode === 'jajan';
    const modes = [
      { id: 'setor', label: 'Setor' },
      { id: 'jajan', label: 'Jajan' }
    ].map((m) => {
      const on = m.id === mode;
      return {
        label: m.label,
        pick: () => this.setState({ mode: m.id }),
        bg: on ? (m.id === 'jajan' ? '#ffe4d2' : '#ffd3e4') : 'transparent',
        color: on ? (m.id === 'jajan' ? '#b4502a' : '#c2457d') : '#74647a',
        ring: on ? 'inset 0 0 0 2px ' + (m.id === 'jajan' ? '#f7c3a4' : '#ffbdd8') : 'none'
      };
    });
    const presets = spend ? [10000, 15000, 25000, 50000] : [10000, 20000, 50000, 100000];
    const chips = presets.map((v) => {
      const on = v === amount;
      return {
        label: this.format(v),
        pick: () => this.setState({ amount: v }),
        bg: on ? (spend ? '#f0a06a' : '#ff7eb3') : '#ffffff',
        color: on ? '#ffffff' : '#5a4a5e',
        border: on ? (spend ? '#f0a06a' : '#ff7eb3') : '#f1e4ea'
      };
    });
    const digits = ['1','2','3','4','5','6','7','8','9','000','0','⌫'];
    const keys = digits.map((d) => ({
      label: d,
      aria: d === '⌫' ? 'Hapus' : d,
      press: () => {
        if (d === '⌫') {
          this.setState({ amount: Math.floor(amount / 10) });
        } else {
          const next = Number(String(amount === 0 ? '' : amount) + d);
          if (next <= 999999999) this.setState({ amount: next });
        }
      }
    }));
    return {
      modes,
      chips,
      keys,
      amountLabel: this.format(amount),
      amountColor: amount > 0 ? '#5a4a5e' : '#9a8aa0',
      hint: spend ? 'Dicatat di warung, saldo dompet dipotong.' : 'Si penabung lari ke kavling, bangunan naik.',
      targetLabel: spend ? 'Kategori' : 'Setor ke kavling',
      targetName: spend ? 'Makan harian' : 'Dana darurat',
      ctaLabel: (spend ? 'Catat jajan ' : 'Setor ') + this.format(amount),
      ctaBg: spend ? 'linear-gradient(180deg, #e0834a, #cf7340)' : 'linear-gradient(180deg, #cf3b7b, #bf3571)',
      ctaShadow: spend ? '0 14px 26px -12px rgba(207,115,64,0.7)' : '0 14px 26px -12px rgba(191,53,113,0.7)'
    };
  }
}
</script>
</body>
</html>
