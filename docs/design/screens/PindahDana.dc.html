<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Pindah dana antar kavling</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:#cfe9f7;color:#5a4a5e}
a{color:#c2457d;text-decoration:none}a:hover{color:#a8336a}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #cfe9f7 0%, #e3f2fb 45%, #fbf1f5 100%); color: #5a4a5e; display: flex; flex-direction: column; overflow: hidden; font-family: 'Nunito', system-ui, sans-serif; font-weight: 700">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 16px 0 16px">
    <a href="GoalDetail.dc.html" aria-label="Kembali ke kavling" style="width: 44px; height: 44px; border-radius: 16px; background: rgba(255,250,247,0.9); border: 2px solid #ffffff; box-shadow: 0 6px 16px rgba(120,60,100,0.14); display: flex; align-items: center; justify-content: center; color: #5a4a5e">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-size: 15px; font-weight: 900">Pindah dana</span>
    <div style="width: 44px; height: 44px"></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 0 16px; flex: 1 1 0; min-height: 0; overflow: hidden">

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; font-weight: 800; color: #74647a; padding-left: 4px">Dari kavling</span>
      <div style="display: flex; gap: 6px">
        <sc-for list="{{fromOpts}}" as="g" hint-placeholder-count="3">
          <button type="button" onClick="{{g.pick}}" style="flex: 1 1 0; display: flex; flex-direction: column; gap: 4px; background: {{g.bg}}; border: 2px solid {{g.border}}; border-radius: 14px; padding: 10px; color: #5a4a5e; text-align: left; cursor: pointer; min-width: 0">
            <span style="font-size: 12px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.name}}</span>
            <span style="font-size: 11px; font-weight: 800; color: #74647a">{{g.saved}}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; justify-content: center">
      <button type="button" onClick="{{swap}}" aria-label="Tukar arah" style="width: 44px; height: 44px; border-radius: 22px; border: 2px solid #ffffff; background: #ffd3e4; color: #c2457d; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 16px rgba(120,60,100,0.14)">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"></path></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; font-weight: 800; color: #74647a; padding-left: 4px">Ke kavling</span>
      <div style="display: flex; gap: 6px">
        <sc-for list="{{toOpts}}" as="g" hint-placeholder-count="3">
          <button type="button" onClick="{{g.pick}}" style="flex: 1 1 0; display: flex; flex-direction: column; gap: 4px; background: {{g.bg}}; border: 2px solid {{g.border}}; border-radius: 14px; padding: 10px; color: #5a4a5e; text-align: left; cursor: pointer; min-width: 0; opacity: {{g.opacity}}">
            <span style="font-size: 12px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.name}}</span>
            <span style="font-size: 11px; font-weight: 800; color: #74647a">{{g.saved}}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0">
      <span style="font-size: 12px; font-weight: 800; color: #74647a">Nominal dipindah</span>
      <span class="num" style="font-size: 36px; font-weight: 900; letter-spacing: -0.6px; line-height: 1">{{amountLabel}}</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
        <button type="button" onClick="{{c.pick}}" style="height: 40px; border-radius: 999px; border: 2px solid {{c.border}}; background: {{c.bg}}; color: {{c.color}}; font-size: 12px; font-weight: 900; cursor: pointer">{{c.label}}</button>
      </sc-for>
    </div>

    <div style="background: #ffffff; border: 2px solid #f6ebf0; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 11px; font-weight: 900; color: #74647a; text-transform: uppercase; letter-spacing: 0.04em">Setelah dipindah</span>
      <sc-for list="{{after}}" as="a" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 800">
            <span>{{a.name}}</span>
            <span style="color: {{a.color}}">{{a.pctFrom}} → {{a.pctTo}}</span>
          </div>
          <div style="height: 8px; border-radius: 999px; background: #f3e8ee; overflow: hidden; position: relative">
            <div style="position: absolute; left: 0; top: 0; height: 8px; width: {{a.wTo}}; border-radius: 999px; background: {{a.bar}}"></div>
          </div>
          <span style="font-size: 11px; font-weight: 800; color: #74647a">{{a.stage}}</span>
        </div>
      </sc-for>
    </div>

    <div style="background: #fff8dd; border-radius: 12px; padding: 8px 10px; font-size: 12px; font-weight: 800; line-height: 1.45">Dicatat sebagai dua setoran: minus di kavling asal, plus di tujuan. Lampu streak tidak menyala karena bukan uang baru.</div>
  </div>

  <div style="padding: 12px 16px 36px 16px">
    <a href="GoalDetail.dc.html" style="height: 56px; border-radius: 999px; background: {{ctaBg}}; color: #ffffff; font-weight: 900; font-size: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 14px 26px -12px rgba(191,53,113,0.7)">{{cta}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { from: 2, to: 0, amount: 500000 };
  }
  fmt(n) { return 'Rp' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  stage(p) { return p >= 1 ? 'Selesai' : p >= 0.7 ? 'Tahap atap' : p >= 0.3 ? 'Tahap dinding' : p > 0 ? 'Fondasi' : 'Lahan kosong'; }
  renderVals() {
    const goals = [
      { name: 'Dana darurat', saved: 3450000, target: 10000000 },
      { name: 'Liburan ke Bali', saved: 1200000, target: 5000000 },
      { name: 'Laptop baru', saved: 8750000, target: 12000000 }
    ];
    const s = this.state;
    const fromOpts = goals.map((g, i) => {
      const on = i === s.from;
      return { name: g.name, saved: this.fmt(g.saved), pick: () => this.setState({ from: i, to: s.to === i ? (i + 1) % 3 : s.to }), bg: on ? '#ffe4d2' : '#ffffff', border: on ? '#f0a06a' : '#f1e4ea' };
    });
    const toOpts = goals.map((g, i) => {
      const on = i === s.to;
      const dis = i === s.from;
      return { name: g.name, saved: this.fmt(g.saved), pick: () => { if (!dis) this.setState({ to: i }); }, bg: on ? '#dcf5ec' : '#ffffff', border: on ? '#6cc8ad' : '#f1e4ea', opacity: dis ? '0.4' : '1' };
    });
    const max = goals[s.from].saved;
    const amount = Math.min(s.amount, max);
    const chips = [100000, 250000, 500000, 1000000].map((v) => {
      const on = v === amount;
      return { label: this.fmt(v).replace('.000.000', ' jt').replace('.000', ' rb'), pick: () => this.setState({ amount: v }), bg: on ? '#ff7eb3' : '#ffffff', color: on ? '#ffffff' : '#5a4a5e', border: on ? '#ff7eb3' : '#f1e4ea' };
    });
    const f = goals[s.from], t = goals[s.to];
    const pf0 = f.saved / f.target, pf1 = (f.saved - amount) / f.target;
    const pt0 = t.saved / t.target, pt1 = Math.min(1, (t.saved + amount) / t.target);
    const pct = (p) => Math.round(p * 100) + '%';
    return {
      fromOpts, toOpts, chips,
      swap: () => this.setState({ from: s.to, to: s.from }),
      amountLabel: this.fmt(amount),
      after: [
        { name: f.name, pctFrom: pct(pf0), pctTo: pct(pf1), wTo: pct(pf1), color: '#c23b3b', bar: '#f0a06a', stage: this.stage(pf1) },
        { name: t.name, pctFrom: pct(pt0), pctTo: pct(pt1), wTo: pct(pt1), color: '#1f8a63', bar: '#6cc8ad', stage: this.stage(pt1) }
      ],
      cta: 'Pindahkan ' + this.fmt(amount),
      ctaBg: amount > 0 ? 'linear-gradient(180deg, #cf3b7b, #bf3571)' : '#d9ccd5'
    };
  }
}
</script>
</body>
</html>
