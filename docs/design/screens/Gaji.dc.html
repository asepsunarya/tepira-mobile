<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Alokasi gaji</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:#cfe9f7;color:#5a4a5e}
a{color:#c2457d;text-decoration:none}a:hover{color:#a8336a}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #cfe9f7 0%, #e3f2fb 45%, #fbf1f5 100%); color: #5a4a5e; display: flex; flex-direction: column; overflow: hidden; font-family: 'Nunito', system-ui, sans-serif; font-weight: 700">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 16px 0 16px">
    <a href="Dompet.dc.html" aria-label="Kembali ke peti harta" style="width: 44px; height: 44px; border-radius: 16px; background: rgba(255,250,247,0.9); border: 2px solid #ffffff; box-shadow: 0 6px 16px rgba(120,60,100,0.14); display: flex; align-items: center; justify-content: center; color: #5a4a5e">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-size: 15px; font-weight: 900">Gaji November</span>
    <div style="width: 44px; height: 44px"></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 0 16px; flex: 1 1 0; min-height: 0; overflow: hidden">

    <div style="background: rgba(255,250,247,0.88); border: 2px solid #ffffff; border-radius: 22px; box-shadow: 0 10px 30px rgba(120,60,100,0.18); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <div style="display: flex; flex-direction: column">
          <label for="gaji" style="font-size: 11px; font-weight: 800; color: #74647a; text-transform: uppercase; letter-spacing: 0.03em">Gaji diterima</label>
          <div style="display: flex; align-items: center; gap: 4px">
            <span style="font-size: 16px; font-weight: 900; color: #74647a">Rp</span>
            <input id="gaji" type="text" inputmode="numeric" value="6.000.000" style="width: 150px; height: 36px; border: 0; background: transparent; font-size: 24px; font-weight: 900; color: #5a4a5e; outline: none; letter-spacing: -0.4px">
          </div>
        </div>
        <span style="font-size: 12px; font-weight: 900; background: #dcf5ec; color: #1f8a63; padding: 6px 10px; border-radius: 999px">Total pas</span>
      </div>
      <div style="height: 10px; border-radius: 999px; background: #f3e8ee; overflow: hidden; display: flex">
        <div style="width: 40%; height: 10px; background: #5b9ae0"></div>
        <div style="width: 15%; height: 10px; background: #f0a06a"></div>
        <div style="width: 17%; height: 10px; background: #ff7eb3"></div>
        <div style="width: 28%; height: 10px; background: #6cc8ad"></div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; color: #74647a">
        <span>Wajib 40%</span><span>Rutin 15%</span><span>Hiburan 17%</span><span style="color: #1f8a63">Tabungan 28%</span>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 0 4px">
      <span style="font-size: 12px; font-weight: 900; color: #74647a; text-transform: uppercase; letter-spacing: 0.04em">Jatah vs realisasi</span>
      <span style="font-size: 11px; font-weight: 800; color: #74647a">hari ke-1 dari 30</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
        <div style="display: flex; flex-direction: column; gap: 4px; background: #ffffff; border: 2px solid #f6ebf0; border-radius: 12px; padding: 7px 10px">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px">
            <span style="font-weight: 800; flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.label}}</span>
            <span style="font-weight: 800; color: #74647a">{{r.used}}</span>
            <span style="font-weight: 900; color: {{r.color}}">{{r.quota}}</span>
          </div>
          <div style="height: 5px; border-radius: 999px; background: #f3e8ee; overflow: hidden">
            <div style="width: {{r.width}}; height: 5px; border-radius: 999px; background: {{r.color}}"></div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="padding: 12px 16px 36px 16px">
    <a href="Dompet.dc.html" style="height: 56px; border-radius: 999px; background: linear-gradient(180deg, #cf3b7b, #bf3571); color: #ffffff; font-weight: 900; font-size: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 14px 26px -12px rgba(191,53,113,0.7)">Simpan alokasi</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { label: 'Makan harian', used: 'Rp0', quota: 'Rp1.200.000', width: '0%', color: '#5b9ae0' },
        { label: 'Transport', used: 'Rp0', quota: 'Rp400.000', width: '0%', color: '#5b9ae0' },
        { label: 'Pulsa & Internet', used: 'Rp0', quota: 'Rp150.000', width: '0%', color: '#5b9ae0' },
        { label: 'Listrik / Air / Kos', used: 'Rp0', quota: 'Rp1.500.000', width: '0%', color: '#5b9ae0' },
        { label: 'Langganan', used: 'Rp54.900', quota: 'Rp120.000', width: '46%', color: '#f0a06a' },
        { label: 'Kesehatan / Obat', used: 'Rp0', quota: 'Rp200.000', width: '0%', color: '#f0a06a' },
        { label: 'Sosial', used: 'Rp0', quota: 'Rp300.000', width: '0%', color: '#f0a06a' },
        { label: 'Nongkrong / jajan', used: 'Rp15.000', quota: 'Rp500.000', width: '3%', color: '#ff7eb3' },
        { label: 'Belanja kecil', used: 'Rp0', quota: 'Rp250.000', width: '0%', color: '#ff7eb3' },
        { label: 'Tabungan ke goal', used: 'Rp100.000', quota: 'Rp1.680.000', width: '6%', color: '#6cc8ad' }
      ]
    };
  }
}
</script>
</body>
</html>
