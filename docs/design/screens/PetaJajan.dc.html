<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Peta jajan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:#cfe9f7;color:#5a4a5e}
a{color:#c2457d;text-decoration:none}a:hover{color:#a8336a}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #dcefe4; color: #5a4a5e; display: flex; flex-direction: column; overflow: hidden; position: relative; font-family: 'Nunito', system-ui, sans-serif; font-weight: 700">

  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0">
    <rect width="390" height="844" fill="#dcefe4"></rect>
    <path d="M0 300 Q120 260 200 320 T390 300 L390 360 Q260 400 180 360 T0 360 Z" fill="#bfe3f3"></path>
    <path d="M60 0 L90 844" stroke="#fffaf7" stroke-width="14" stroke-linecap="round"></path>
    <path d="M0 520 L390 480" stroke="#fffaf7" stroke-width="18" stroke-linecap="round"></path>
    <path d="M250 0 L300 844" stroke="#fffaf7" stroke-width="10" stroke-linecap="round"></path>
    <path d="M0 660 Q200 700 390 640" stroke="#fffaf7" stroke-width="10" stroke-linecap="round" fill="none"></path>
    <rect x="110" y="120" width="90" height="60" rx="10" fill="#cfe6d5"></rect>
    <rect x="300" y="560" width="70" height="50" rx="10" fill="#cfe6d5"></rect>
    <rect x="120" y="700" width="100" height="70" rx="10" fill="#cfe6d5"></rect>
    <circle cx="195" cy="470" r="16" fill="#5b9ae0" opacity="0.25"></circle>
    <circle cx="195" cy="470" r="7" fill="#5b9ae0" stroke="#ffffff" stroke-width="3"></circle>
  </svg>

  <sc-for list="{{pins}}" as="p" hint-placeholder-count="4">
    <button type="button" onClick="{{p.pick}}" aria-label="{{p.aria}}" style="position: absolute; left: {{p.x}}; top: {{p.y}}; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: transparent; padding: 0; cursor: pointer; min-width: 44px; min-height: 44px">
      <span style="background: {{p.bg}}; color: {{p.color}}; border: 2px solid #ffffff; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 900; box-shadow: 0 6px 16px rgba(120,60,100,0.2); white-space: nowrap">{{p.amount}}</span>
      <svg aria-hidden="true" width="16" height="12" viewBox="0 0 16 12"><path d="M0 0 L16 0 L8 12 Z" fill="{{p.bg}}"></path></svg>
    </button>
  </sc-for>

  <div style="position: absolute; left: 16px; right: 16px; top: 56px; display: flex; align-items: center; gap: 8px">
    <a href="Warung.dc.html" aria-label="Kembali ke warung" style="width: 44px; height: 44px; flex: 0 0 auto; border-radius: 16px; background: rgba(255,250,247,0.92); border: 2px solid #ffffff; box-shadow: 0 6px 16px rgba(120,60,100,0.14); display: flex; align-items: center; justify-content: center; color: #5a4a5e">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="flex: 1 1 0; height: 44px; background: rgba(255,250,247,0.92); border: 2px solid #ffffff; border-radius: 16px; box-shadow: 0 6px 16px rgba(120,60,100,0.14); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900">Peta jajan · November</div>
    <div style="display: flex; padding: 4px; gap: 2px; background: rgba(255,250,247,0.92); border: 2px solid #ffffff; border-radius: 16px; box-shadow: 0 6px 16px rgba(120,60,100,0.14)">
      <sc-for list="{{themes}}" as="t" hint-placeholder-count="3">
        <button type="button" onClick="{{t.pick}}" aria-label="{{t.label}}" style="width: 32px; height: 32px; border-radius: 10px; border: 0; background: {{t.bg}}; color: #5a4a5e; font-size: 10px; font-weight: 900; cursor: pointer">{{t.short}}</button>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; right: 16px; top: 120px; display: flex; flex-direction: column; gap: 6px">
    <button type="button" aria-label="Perbesar" style="width: 44px; height: 44px; border-radius: 14px; border: 2px solid #ffffff; background: rgba(255,250,247,0.92); color: #5a4a5e; font-size: 20px; font-weight: 900; cursor: pointer; box-shadow: 0 6px 16px rgba(120,60,100,0.14)">+</button>
    <button type="button" aria-label="Perkecil" style="width: 44px; height: 44px; border-radius: 14px; border: 2px solid #ffffff; background: rgba(255,250,247,0.92); color: #5a4a5e; font-size: 20px; font-weight: 900; cursor: pointer; box-shadow: 0 6px 16px rgba(120,60,100,0.14)">−</button>
    <button type="button" aria-label="Lokasiku" style="width: 44px; height: 44px; border-radius: 14px; border: 2px solid #ffffff; background: rgba(255,250,247,0.92); color: #5b9ae0; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 16px rgba(120,60,100,0.14)">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="2"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
    </button>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 36px; background: #fffaf7; border: 2px solid #ffffff; border-radius: 22px; box-shadow: 0 18px 40px -20px rgba(120,60,100,0.5); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px">
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 15px; font-weight: 900">{{sel.name}}</span>
        <span style="font-size: 11px; font-weight: 800; color: #74647a">{{sel.meta}}</span>
      </div>
      <span style="font-size: 12px; font-weight: 900; background: {{sel.badgeBg}}; color: {{sel.badgeColor}}; padding: 4px 10px; border-radius: 999px; white-space: nowrap">{{sel.badge}}</span>
    </div>
    <div style="height: 8px; border-radius: 999px; background: #f3e8ee; overflow: hidden">
      <div style="width: {{sel.width}}; height: 8px; border-radius: 999px; background: {{sel.bar}}"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; color: #66566b">
      <span>{{sel.spent}}</span>
      <span>{{sel.limit}}</span>
    </div>
    <div style="display: flex; gap: 8px">
      <a href="TambahSetoran.dc.html" style="flex: 1 1 0; height: 44px; border-radius: 999px; background: #ffe4d2; color: #b4502a; font-size: 13px; font-weight: 900; display: flex; align-items: center; justify-content: center">Catat jajan di sini</a>
      <button type="button" style="flex: 1 1 0; height: 44px; border-radius: 999px; border: 2px solid #f1e4ea; background: #ffffff; color: #5a4a5e; font-size: 13px; font-weight: 900; cursor: pointer">Atur batas</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0, theme: 0 };
  }
  renderVals() {
    const places = [
      { name: 'Kopi Toko Djawa', meta: 'Nongkrong · 6 kali bulan ini · 400 m', amount: 'Rp247 rb', x: '140px', y: '300px', spent: 'Rp247.000 dipakai', limit: 'Batas Rp300.000', width: '82%', bar: '#f3c35b', badge: 'Hampir batas', badgeBg: '#fff3d1', badgeColor: '#a87a12' },
      { name: 'Bakso Pak Ujang', meta: 'Makan harian · 9 kali bulan ini · 150 m', amount: 'Rp135 rb', x: '250px', y: '430px', spent: 'Rp135.000 dipakai', limit: 'Belum ada batas', width: '0%', bar: '#6cc8ad', badge: 'Aman', badgeBg: '#dcf5ec', badgeColor: '#1f8a63' },
      { name: 'SPBU Dago', meta: 'Transport · 2 kali bulan ini · 1,2 km', amount: 'Rp120 rb', x: '300px', y: '620px', spent: 'Rp120.000 dipakai', limit: 'Batas Rp200.000', width: '60%', bar: '#6cc8ad', badge: 'Aman', badgeBg: '#dcf5ec', badgeColor: '#1f8a63' },
      { name: 'Indomaret Tubagus', meta: 'Belanja kecil · 4 kali bulan ini · 300 m', amount: 'Rp96 rb', x: '110px', y: '560px', spent: 'Rp96.000 dipakai', limit: 'Batas Rp80.000', width: '100%', bar: '#e86d6d', badge: 'Lewat batas', badgeBg: '#ffe0e0', badgeColor: '#c23b3b' }
    ];
    const sel = this.state.sel;
    const pins = places.map((p, i) => {
      const on = i === sel;
      return {
        ...p,
        aria: p.name + ', ' + p.amount,
        pick: () => this.setState({ sel: i }),
        bg: on ? '#ff7eb3' : '#fffaf7',
        color: on ? '#ffffff' : '#5a4a5e'
      };
    });
    const themeDefs = [
      { short: 'Desa', label: 'Ikut cuaca desa' },
      { short: 'Siang', label: 'Siang' },
      { short: 'Malam', label: 'Malam' }
    ];
    const themes = themeDefs.map((t, i) => ({
      ...t,
      pick: () => this.setState({ theme: i }),
      bg: i === this.state.theme ? '#ffd3e4' : 'transparent'
    }));
    return { pins, themes, sel: places[sel] };
  }
}
</script>
</body>
</html>
