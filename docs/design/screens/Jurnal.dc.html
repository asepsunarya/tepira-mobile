<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Jurnal tahun ini</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:#cfe9f7;color:#5a4a5e}
a{color:#c2457d;text-decoration:none}a:hover{color:#a8336a}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #cfe9f7 0%, #e3f2fb 45%, #fbf1f5 100%); color: #5a4a5e; display: flex; flex-direction: column; overflow: hidden; font-family: 'Nunito', system-ui, sans-serif; font-weight: 700">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 16px 0 16px">
    <a href="Main.dc.html" aria-label="Kembali ke desa" style="width: 44px; height: 44px; border-radius: 16px; background: rgba(255,250,247,0.9); border: 2px solid #ffffff; box-shadow: 0 6px 16px rgba(120,60,100,0.14); display: flex; align-items: center; justify-content: center; color: #5a4a5e">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-size: 15px; font-weight: 900">Jurnal 2026</span>
    <div style="width: 44px; height: 44px"></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 0 16px; flex: 1 1 0; min-height: 0; overflow: hidden">

    <div style="background: rgba(255,250,247,0.88); border: 2px solid #ffffff; border-radius: 22px; box-shadow: 0 10px 30px rgba(120,60,100,0.18); padding: 14px 16px; display: flex; align-items: center; gap: 14px">
      <div style="position: relative; width: 96px; height: 96px; flex: 0 0 auto">
        <svg role="img" aria-label="Hari ke-305 dari 365" width="96" height="96" viewBox="0 0 96 96">
          <circle cx="48" cy="48" r="40" fill="none" stroke="#f3e8ee" stroke-width="10"></circle>
          <circle cx="48" cy="48" r="40" fill="none" stroke="#5b9ae0" stroke-width="10" stroke-linecap="round" stroke-dasharray="210 251" transform="rotate(-90 48 48)"></circle>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1">
          <span style="font-size: 22px; font-weight: 900">305</span>
          <span style="font-size: 10px; font-weight: 800; color: #74647a">dari 365</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; flex: 1 1 0; min-width: 0">
        <span style="font-size: 11px; font-weight: 800; color: #74647a; text-transform: uppercase; letter-spacing: 0.03em">Musim sekarang</span>
        <div style="display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 900">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b9ae0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15a4 4 0 0 1 .5-8 5 5 0 0 1 9.5 1 3.5 3.5 0 0 1 0 7H7z"></path><path d="M8 19v2M12 19v2M16 19v2"></path></svg>
          Musim hujan
        </div>
        <span style="font-size: 12px; font-weight: 800; color: #66566b">Baru mulai 1 Nov. Musim panen 1 Mar, 120 hari lagi.</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{months}}" as="m" hint-placeholder-count="12">
        <button type="button" onClick="{{m.pick}}" style="height: 32px; border-radius: 999px; border: 2px solid {{m.border}}; background: {{m.bg}}; color: {{m.color}}; font-size: 11px; font-weight: 900; cursor: pointer">{{m.label}}</button>
      </sc-for>
    </div>

    <div style="background: #ffffff; border: 2px solid #f6ebf0; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 12px; font-weight: 900">Kalender kebiasaan · {{monthName}}</span>
        <span style="font-size: 11px; font-weight: 800; color: #74647a">{{monthDays}} hari tercatat</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="31">
          <div aria-label="{{d.aria}}" style="height: 22px; border-radius: 6px; background: {{d.bg}}; border: 2px solid {{d.border}}; box-sizing: border-box"></div>
        </sc-for>
      </div>
      <div style="display: flex; gap: 12px; font-size: 10px; font-weight: 800; color: #74647a">
        <span style="display: flex; align-items: center; gap: 4px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #f3c35b"></span>Tercatat</span>
        <span style="display: flex; align-items: center; gap: 4px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #6cc8ad"></span>Nol jajan</span>
        <span style="display: flex; align-items: center; gap: 4px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #f3e8ee"></span>Terlewat</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="6">
        <div style="background: #ffffff; border: 2px solid #f6ebf0; border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 10px; font-weight: 800; color: #74647a; text-transform: uppercase">{{s.label}}</span>
          <span style="font-size: 15px; font-weight: 900">{{s.value}}</span>
        </div>
      </sc-for>
    </div>

    <label style="display: flex; align-items: center; gap: 10px; background: #ffffff; border: 2px solid #f6ebf0; border-radius: 12px; padding: 10px 12px; font-size: 12px; font-weight: 800; cursor: pointer">
      <input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: #ff7eb3">
      <span style="flex: 1 1 0">Kurangi efek musim (hujan, kunang-kunang, daun gugur)</span>
    </label>
  </div>

  <div style="padding: 12px 16px 36px 16px">
    <a href="Main.dc.html" style="height: 56px; border-radius: 999px; background: rgba(255,255,255,0.86); border: 2px solid #f1e4ea; color: #5a4a5e; font-weight: 900; font-size: 16px; display: flex; align-items: center; justify-content: center">Jalan-jalan ke desa {{monthName}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { month: 10 };
  }
  renderVals() {
    const names = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    const full = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    const sel = this.state.month;
    const months = names.map((n, i) => {
      const on = i === sel;
      const future = i > 10;
      return {
        label: n,
        pick: () => this.setState({ month: i }),
        bg: on ? '#ffd3e4' : '#ffffff',
        border: on ? '#ff7eb3' : '#f1e4ea',
        color: future ? '#b8aabd' : (on ? '#c2457d' : '#5a4a5e')
      };
    });
    const pattern = [1,1,0,1,1,1,2,1,1,1,0,1,1,1,1,2,1,1,0,1,1,1,1,1,2,1,1,1,0,1,1];
    const len = [31,28,31,30,31,30,31,31,30,31,30,31][sel];
    const today = sel === 10 ? 1 : (sel > 10 ? 0 : len);
    const days = [];
    for (let i = 0; i < len; i++) {
      const past = i < today;
      const v = past ? pattern[i] : -1;
      days.push({
        aria: 'Tanggal ' + (i + 1),
        bg: v === 1 ? '#f3c35b' : v === 2 ? '#6cc8ad' : v === 0 ? '#f3e8ee' : '#ffffff',
        border: i === today - 1 && sel === 10 ? '#ff7eb3' : (v === -1 ? '#f3e8ee' : 'transparent')
      });
    }
    const counted = days.filter((d) => d.bg === '#f3c35b' || d.bg === '#6cc8ad').length;
    return {
      months,
      days,
      monthName: full[sel],
      monthDays: counted,
      stats: [
        { label: 'Hari tercatat', value: '212' },
        { label: 'Deret terpanjang', value: '31 hari' },
        { label: 'Deret sekarang', value: '5 hari' },
        { label: 'Goal dibuat', value: '3' },
        { label: 'Warga', value: '3' },
        { label: 'Level', value: 'Lv 5' }
      ]
    };
  }
}
</script>
</body>
</html>
