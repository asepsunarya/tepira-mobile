<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Bangun kavling baru</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:#cfe9f7;color:#5a4a5e}
a{color:#c2457d;text-decoration:none}a:hover{color:#a8336a}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #cfe9f7 0%, #e3f2fb 45%, #fbf1f5 100%); color: #5a4a5e; display: flex; flex-direction: column; overflow: hidden; font-family: 'Nunito', system-ui, sans-serif; font-weight: 700">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 56px 16px 0 16px">
    <a href="Main.dc.html" aria-label="Kembali ke desa" style="width: 44px; height: 44px; border-radius: 16px; background: rgba(255,250,247,0.9); border: 2px solid #ffffff; box-shadow: 0 6px 16px rgba(120,60,100,0.14); display: flex; align-items: center; justify-content: center; color: #5a4a5e">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-size: 15px; font-weight: 900">Bangun kavling</span>
    <div style="width: 44px; height: 44px"></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 14px 16px 0 16px; flex: 1 1 0; min-height: 0; overflow: hidden">

    <div style="background: rgba(255,250,247,0.88); border: 2px solid #ffffff; border-radius: 22px; box-shadow: 0 10px 30px rgba(120,60,100,0.18); padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="height: 110px; border-radius: 16px; background: linear-gradient(180deg, #d8effa, #bfe3f3); position: relative; overflow: hidden">
        <svg aria-hidden="true" width="326" height="110" viewBox="0 0 326 110" style="position: absolute; left: 0; top: 0">
          <ellipse cx="163" cy="92" rx="140" ry="20" fill="#7fcfe6"></ellipse>
          <ellipse cx="163" cy="86" rx="108" ry="16" fill="#f3c35b"></ellipse>
          <ellipse cx="163" cy="80" rx="94" ry="12" fill="#6cc8ad"></ellipse>
          <path d="M118 84 L208 84 L208 62 L118 62 Z" fill="none" stroke="#5a4a5e" stroke-width="2" stroke-dasharray="6 5"></path>
          <rect x="116" y="56" width="4" height="30" fill="#8b6b4a"></rect>
          <rect x="206" y="56" width="4" height="30" fill="#8b6b4a"></rect>
          <path d="M120 60 L206 60" stroke="#ff7eb3" stroke-width="2"></path>
          <rect x="150" y="40" width="30" height="18" rx="2" fill="#fffaf7" stroke="#5a4a5e" stroke-width="1.5"></rect>
          <rect x="163" y="58" width="3" height="26" fill="#8b6b4a"></rect>
          <rect x="84" y="66" width="4" height="18" fill="#5a4a5e"></rect>
          <path d="M86 40 L100 68 L72 68 Z" fill="#37957c"></path>
          <rect x="236" y="70" width="4" height="14" fill="#5a4a5e"></rect>
          <path d="M238 52 L250 72 L226 72 Z" fill="#4fb396"></path>
        </svg>
        <span style="position: absolute; left: 10px; top: 10px; background: rgba(255,250,247,0.92); border: 2px solid #ffffff; border-radius: 999px; padding: 4px 10px; font-size: 11px; font-weight: 900; color: #74647a">Lahan kosong · 2 kavling tersisa</span>
      </div>
      <span style="font-size: 12px; font-weight: 800; color: #66566b; line-height: 1.45">Kavling dipatok di desa. Setoran pertama memasang fondasinya; dinding naik di 30%, atap di 70%.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; font-weight: 800; color: #74647a; padding-left: 4px">Jenis bangunan</span>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{kinds}}" as="k" hint-placeholder-count="4">
          <button type="button" onClick="{{k.pick}}" style="height: 60px; border-radius: 14px; border: 2px solid {{k.border}}; background: {{k.bg}}; color: #5a4a5e; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; font-weight: 900; cursor: pointer">
            <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><path d="{{k.roof}}" fill="{{k.roofFill}}"></path><rect x="6" y="11" width="12" height="9" fill="#fffaf7" stroke="#5a4a5e" stroke-width="1.5"></rect><rect x="10" y="14" width="4" height="6" fill="#5a4a5e"></rect></svg>
            {{k.name}}
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="nama" style="font-size: 12px; font-weight: 800; color: #74647a; padding-left: 4px">Nama goal</label>
      <input id="nama" type="text" placeholder="Misal: Sepeda baru" style="height: 46px; box-sizing: border-box; border: 2px solid #f1e4ea; border-radius: 12px; background: #fff8fb; padding: 0 12px; font-size: 14px; font-weight: 700; color: #5a4a5e; outline: none">
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="target" style="font-size: 12px; font-weight: 800; color: #74647a; padding-left: 4px">Target</label>
        <div style="display: flex; align-items: center; gap: 4px; height: 46px; box-sizing: border-box; border: 2px solid #f1e4ea; border-radius: 12px; background: #fff8fb; padding: 0 10px">
          <span style="font-size: 14px; font-weight: 900; color: #74647a">Rp</span>
          <input id="target" type="text" inputmode="numeric" placeholder="5.000.000" style="flex: 1 1 0; min-width: 0; height: 40px; border: 0; background: transparent; font-size: 16px; font-weight: 900; color: #5a4a5e; outline: none">
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="tanggal" style="font-size: 12px; font-weight: 800; color: #74647a; padding-left: 4px">Target tanggal</label>
        <input id="tanggal" type="date" value="2027-06-30" style="height: 46px; box-sizing: border-box; border: 2px solid #f1e4ea; border-radius: 12px; background: #fff8fb; padding: 0 10px; font-size: 14px; font-weight: 700; color: #5a4a5e; outline: none">
      </div>
    </div>

    <p style="margin: 0; font-size: 12px; font-weight: 800; background: #fff8dd; border-radius: 12px; padding: 8px 10px; display: flex; gap: 8px; align-items: flex-start; line-height: 1.45">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a87a12" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 auto; margin-top: 1px"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      <span>Kejar deadline: sekitar Rp145.000 per minggu supaya tukang tetap bekerja sesuai jadwal. Telat, rumput liar tumbuh.</span>
    </p>
  </div>

  <div style="padding: 12px 16px 36px 16px; display: flex; flex-direction: column; gap: 8px">
    <a href="Main.dc.html" style="height: 56px; border-radius: 999px; background: linear-gradient(180deg, #cf3b7b, #bf3571); color: #ffffff; font-weight: 900; font-size: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 14px 26px -12px rgba(191,53,113,0.7)">Patok kavling</a>
    <a href="Main.dc.html" style="height: 44px; border-radius: 999px; color: #74647a; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center">Batal</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { kind: 0 };
  }
  renderVals() {
    const defs = [
      { name: 'Rumah', roof: 'M4 11 L12 4 L20 11 Z', roofFill: '#ff7eb3' },
      { name: 'Toko', roof: 'M4 11 L20 11 L20 8 L4 8 Z', roofFill: '#f0a06a' },
      { name: 'Menara', roof: 'M8 11 L12 2 L16 11 Z', roofFill: '#6cc8ad' },
      { name: 'Gudang', roof: 'M4 11 Q12 3 20 11 Z', roofFill: '#f3c35b' }
    ];
    const kinds = defs.map((it, i) => {
      const on = i === this.state.kind;
      return {
        ...it,
        pick: () => this.setState({ kind: i }),
        bg: on ? '#ffd3e4' : '#ffffff',
        border: on ? '#ff7eb3' : '#f1e4ea'
      };
    });
    return { kinds };
  }
}
</script>
</body>
</html>
