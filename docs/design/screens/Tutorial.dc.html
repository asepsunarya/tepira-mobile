<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Tur sambutan desa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:#cfe9f7;color:#5a4a5e}
a{color:#c2457d;text-decoration:none}a:hover{color:#a8336a}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, #cfe9f7 0%, #e3f2fb 45%, #fbf1f5 100%); color: #5a4a5e; display: flex; flex-direction: column; overflow: hidden; position: relative; font-family: 'Nunito', system-ui, sans-serif; font-weight: 700">

  <div style="position: absolute; inset: 0; opacity: 0.55">
    <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844">
      <ellipse cx="195" cy="470" rx="190" ry="60" fill="#7fcfe6"></ellipse>
      <ellipse cx="195" cy="455" rx="150" ry="46" fill="#f3c35b"></ellipse>
      <ellipse cx="195" cy="445" rx="132" ry="38" fill="#6cc8ad"></ellipse>
      <rect x="150" y="396" width="60" height="44" fill="#fffaf7"></rect>
      <path d="M144 398 L180 362 L216 398 Z" fill="#ff7eb3"></path>
      <rect x="170" y="416" width="16" height="24" fill="#5a4a5e"></rect>
      <rect x="270" y="410" width="5" height="30" fill="#5a4a5e"></rect>
      <path d="M272 356 L296 410 L248 410 Z" fill="#37957c"></path>
      <rect x="90" y="420" width="30" height="18" rx="3" fill="#cc922c"></rect>
      <rect x="90" y="412" width="30" height="11" rx="3" fill="#e3a93c"></rect>
    </svg>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(90,74,94,0.28)"></div>

  <div style="position: absolute; left: 110px; top: 340px; width: 170px; height: 120px; border-radius: 24px; border: 3px dashed #ffffff; box-shadow: 0 0 0 6px rgba(255,255,255,0.35)"></div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 36px; background: #fffaf7; border: 2px solid #ffffff; border-radius: 22px; box-shadow: 0 18px 40px -20px rgba(120,60,100,0.5); padding: 18px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 11px; font-weight: 900; background: #ffd3e4; color: #c2457d; padding: 4px 10px; border-radius: 999px">Tur desa · {{stepNo}} dari 9</span>
      <a href="IzinNotifikasi.dc.html" style="font-size: 12px; font-weight: 900; color: #74647a; min-height: 44px; display: flex; align-items: center">Lewati tur</a>
    </div>
    <h2 style="margin: 0; font-size: 20px; font-weight: 900; line-height: 1.2">{{title}}</h2>
    <p style="margin: 0; font-size: 14px; font-weight: 700; line-height: 1.5; color: #66566b">{{body}}</p>
    <div style="display: flex; gap: 4px" aria-label="Langkah tur">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="9">
        <span style="flex: 1 1 0; height: 6px; border-radius: 999px; background: {{d.bg}}"></span>
      </sc-for>
    </div>
    <div style="display: flex; gap: 8px">
      <button type="button" onClick="{{prev}}" style="height: 48px; padding: 0 18px; border-radius: 999px; border: 2px solid #f1e4ea; background: #ffffff; color: #5a4a5e; font-size: 14px; font-weight: 900; cursor: pointer">Kembali</button>
      <button type="button" onClick="{{next}}" style="flex: 1 1 0; height: 48px; border-radius: 999px; border: 0; background: linear-gradient(180deg, #cf3b7b, #bf3571); color: #ffffff; font-size: 15px; font-weight: 900; cursor: pointer; box-shadow: 0 14px 26px -12px rgba(191,53,113,0.7)">{{nextLabel}}</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 1 };
  }
  renderVals() {
    const steps = [
      { title: 'Selamat datang di desamu, [NAMA]!', body: 'Ini pulau tabunganmu. Tiap goal jadi bangunan yang tumbuh setiap kamu menyetor. Yuk keliling sebentar.' },
      { title: 'Kenalan sama pulaumu', body: 'Balai Desa di tengah menyimpan skor kesehatan dan surat. Warung di kiri mencatat jajan, peti harta di utara adalah dompetmu.' },
      { title: 'Bikin dompet pertama', body: 'Dompet dipakai untuk mencatat dari mana uang keluar: tunai, e-wallet, rekening, atau kartu kredit.' },
      { title: 'Bagi gaji bulan ini', body: 'Alokasikan gaji ke sembilan kategori dan tabungan. Totalnya harus pas, sisa jatah tampil tiap bulan.' },
      { title: 'Buka kavling pertama', body: 'Kavling baru masih lahan kosong. Setoran pertama akan memasang fondasinya.' },
      { title: 'Setoran pertama', body: 'Coba setor Rp10.000. Si penabung lari ke kavling dan bangunannya mulai naik.' },
      { title: 'Catat pengeluaran (opsional)', body: 'Jajan dicatat di warung. Saldo dompet dipotong dan jatah kategori berkurang.' },
      { title: 'Riwayat dan ringkasan bulan', body: 'Semua catatan bisa diedit. Skor kesehatan menentukan cuaca pulau tiap bulan.' },
      { title: 'Desamu siap tumbuh!', body: 'Level naik 1 XP per Rp10.000 ditabung dan 5 XP per setoran. Tiap 7 hari beruntun, satu warga pindah ke desa.' }
    ];
    const i = this.state.step - 1;
    const s = steps[i];
    return {
      stepNo: this.state.step,
      title: s.title,
      body: s.body,
      dots: steps.map((_, j) => ({ bg: j <= i ? '#ff7eb3' : '#f3e8ee' })),
      prev: () => this.setState({ step: Math.max(1, this.state.step - 1) }),
      next: () => this.setState({ step: Math.min(9, this.state.step + 1) }),
      nextLabel: i === 8 ? 'Mulai menabung' : 'Lanjut'
    };
  }
}
</script>
</body>
</html>
