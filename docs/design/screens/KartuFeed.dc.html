      <span style="font-size: 24px; font-weight: 900; color: #c2457d">tepira.id</span>
    </div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"hideAmount":{"editor":"boolean","default":false},"$preview":{"width":1080,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return { amount: this.props.hideAmount ? 'Target tercapai' : 'Rp5.000.000 terkumpul' };
  }
}
</script>
